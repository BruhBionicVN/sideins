workflows:
  sideinstaller-build:
    name: Build SideInstaller iOS 26 Unsigned
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Setup, Compile Core and Build IPA
        script: |
          # 1. Khóa cứng đường dẫn bộ Xcode hệ thống
          export DEVELOPER_DIR="/Applications/Xcode-26.4.app/Contents/Developer"
          sudo xcode-select -s /Applications/Xcode-26.4.app/Contents/Developer
          export IPHONEOS_DEPLOYMENT_TARGET="26.0"
          
          # 2. Tải an toàn script Rustup về file cục bộ và thực thi cài đặt
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs -o rustup-init.sh
          chmod +x rustup-init.sh
          ./rustup-init.sh -y --default-toolchain stable
          
          # Cấu hình cứng đường dẫn PATH toàn cục cho phiên làm việc này
          export PATH="$HOME/.cargo/bin:$PATH"
          
          # Thêm các kiến trúc bắt buộc cho nền tảng iOS
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          
          # 3. Tiến hành biên dịch các thư viện tĩnh lõi Rust
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cd ..
          
          # 4. Tự đóng gói XCFramework thủ công tại thư mục gốc
          rm -rf SideInstallerFFI.xcframework
          sudo xcodebuild -create-xcframework \
            -library rust-core/target/aarch64-apple-ios/release/libsideinstaller_ffi.a -headers rust-core/include \
            -library rust-core/target/aarch64-apple-ios-sim/release/libsideinstaller_ffi.a -headers rust-core/include \
            -output ./SideInstallerFFI.xcframework
          
          # 5. Cài đặt XcodeGen và tạo cấu trúc dự án
          brew install xcodegen
          xcodegen generate
          
          # 6. Biên dịch ứng dụng chính thức sang định dạng .app
          xcodebuild -project SideInstaller.xcodeproj -scheme SideInstaller -configuration Release -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO
          
      - name: Package Application to IPA
        script: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SideInstaller.app Payload/ 2>/dev/null || cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/SideInstaller.app Payload/
          zip -r SideInstaller.zip Payload
          mv SideInstaller.zip SideInstaller_iOS26.ipa
    artifacts:
      - SideInstaller_iOS26.ipa
