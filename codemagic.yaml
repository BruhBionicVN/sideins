workflows:
  sideinstaller-build:
    name: Build SideInstaller iOS 26 Unsigned
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Install Complete Rust Toolchain
        script: |
          # Sửa chính xác đường dẫn tải script cài đặt Rust trực tiếp
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          
          # Cấu hình biến môi trường cục bộ để hệ thống nhận diện lệnh ngay lập tức
          export PATH="$HOME/.cargo/bin:$PATH"
          
          # Thêm mục tiêu biên dịch cho thiết bị iOS thật
          rustup target add aarch64-apple-ios
      - name: Build Rust Core to XCFramework
        script: |
          # Kích hoạt lại biến môi trường cho phiên làm việc mới
          export PATH="$HOME/.cargo/bin:$PATH"
          
          chmod +x build-rust.sh
          ./build-rust.sh
      - name: Install XcodeGen and Generate Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build Xcode Project (Unsigned)
        script: |
          xcodebuild -project SideInstaller.xcodeproj -scheme SideInstaller -configuration Release -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO
      - name: Package to IPA
        script: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SideInstaller.app Payload/ 2>/dev/null || cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/SideInstaller.app Payload/
          zip -r SideInstaller.zip Payload
          mv SideInstaller.zip SideInstaller_iOS26.ipa
    artifacts:
      - SideInstaller_iOS26.ipa
