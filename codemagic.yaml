workflows:
  sideinstaller-build:
    name: Build SideInstaller iOS 26 Unsigned
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Setup Compiler Environment
        script: |
          export DEVELOPER_DIR="/Applications/Xcode-26.4.app/Contents/Developer"
          sudo xcode-select -s /Applications/Xcode-26.4.app/Contents/Developer
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y --default-toolchain stable
          brew install xcodegen

      - name: Build Rust Core to XCFramework
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          chmod +x build-rust.sh
          ./build-rust.sh
          echo "=== Kiem tra thu muc goc sau khi build Rust ==="
          ls -la

      - name: Generate Xcode Project and Build IPA
        script: |
          export DEVELOPER_DIR="/Applications/Xcode-26.4.app/Contents/Developer"
          xcodegen generate
          xcodebuild -project SideInstaller.xcodeproj -scheme SideInstaller -configuration Release -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO

      - name: Package Application to IPA
        script: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SideInstaller.app Payload/ 2>/dev/null || cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/SideInstaller.app Payload/
          zip -r SideInstaller.zip Payload
          mv SideInstaller.zip SideInstaller_iOS26.ipa
    artifacts:
      - SideInstaller_iOS26.ipa
